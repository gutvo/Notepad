name: Auto Assign Milestone

on:
  pull_request:
    types: [opened]

jobs:
  milestone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Assign Milestone based on package.json version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }} # Use seu Personal Access Token aqui
          script: |
            const fs = require("fs");

            // 1️⃣ Lê versão do package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version;
            console.log("Versão do projeto:", version);

            // 2️⃣ Buscar milestones abertas
            const { data: openMilestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });

            let milestone = openMilestones.find(m => m.title === version);

            if (!milestone) {
              // 3️⃣ Buscar milestones fechadas
              const { data: closedMilestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "closed"
              });

              milestone = closedMilestones.find(m => m.title === version);

              if (milestone) {
                console.log(`Reabrindo milestone fechada: ${version}`);

                // Reabrir milestone
                const reopened = await github.rest.issues.updateMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  milestone_number: milestone.number,
                  state: "open"
                });

                milestone = reopened.data;
              } else {
                // 4️⃣ Se não existir nenhuma, criar nova
                console.log(`Milestone não encontrada. Criando: ${version}`);

                const created = await github.rest.issues.createMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: version,
                  description: `Milestone gerada automaticamente para a versão ${version}.`
                });

                milestone = created.data;
              }
            }

            // 5️⃣ Atribui o milestone à PR
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              milestone: milestone.number
            });

            console.log(`Milestone aplicada: ${milestone.title}`);
