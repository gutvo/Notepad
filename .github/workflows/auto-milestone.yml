name: Auto Assign Milestone

on:
  pull_request:
    types: [opened]

jobs:
  milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            // 1) Lê version do package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version;

            console.log("Versão do projeto:", version);

            // 2) Busca milestones existentes
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });

            let milestone = milestones.find(m => m.title === version);

            // 3) Se não existe → criar
            if (!milestone) {
              console.log(`Milestone ${version} não existe. Criando...`);

              const created = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: version,
                description: `Milestone gerado automaticamente para a versão ${version}.`
              });

              milestone = created.data;
            }

            // 4) Atribui o milestone à PR
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              milestone: milestone.number
            });

            console.log(`Milestone aplicado: ${milestone.title}`);
