name: Auto PR Title

on:
  pull_request:
    types: [opened]   # ⚠️ somente na criação

jobs:
  set_title:
    runs-on: ubuntu-latest
    steps:
      - name: Set PR Title From Branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Emoji por prefixo
            const emojiMap = {
              "feature/": "🚀",
              "fix/": "🐛",
              "improvement/": "✨",
              "refactor/": "🔧"
            };

            let emoji = "";
            let title = branch;

            // Descobrir o emoji correto
            for (const prefix in emojiMap) {
              if (branch.startsWith(prefix)) {
                emoji = emojiMap[prefix];
                break;
              }
            }

            // Remover o prefixo da branch
            title = title.replace(/^(feature\/|fix\/|improvement\/|refactor\/)/, "");

            // Trocar "-" por espaço
            title = title.replace(/-/g, " ");

            // Primeira letra maiúscula
            title = title.charAt(0).toUpperCase() + title.slice(1);

            // Montar título final
            if (emoji) {
              title = `${emoji} ${title}`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: title
            });

            console.log(`Título atualizado para: ${title}`);
