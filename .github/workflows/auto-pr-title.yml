name: Auto PR Title

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  set_title:
    runs-on: ubuntu-latest
    steps:
      - name: Set PR Title From Branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref.toLowerCase();

            const emojiMap = {
              "feat/": "✨",
              "feature/": "✨",
              "fix/": "🐛",
              "bugfix/": "🐛",
              "hotfix/": "🚑",
              "refactor/": "♻️",
              "perf/": "⚡",
              "improvement/": "🚀",
              "chore/": "🧹",
              "docs/": "📚",
              "style/": "🎨",
              "test/": "✅",
              "ci/": "👷",
              "build/": "📦",
              "revert/": "⏪"
            };

            let emoji = "";
            let prefixMatched = "";

            for (const prefix in emojiMap) {
              if (branch.startsWith(prefix)) {
                emoji = emojiMap[prefix];
                prefixMatched = prefix;
                break;
              }
            }

            // Remove prefix
            let title = branch.replace(prefixMatched, "");

            // Replace "-" by space
            title = title.replace(/-/g, " ");

            // Capitalize first letter
            title = title.charAt(0).toUpperCase() + title.slice(1);

            if (emoji) {
              title = `${emoji} ${title}`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: title
            });

            console.log(`Título atualizado para: ${title}`);