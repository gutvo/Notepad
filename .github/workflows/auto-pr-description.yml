name: Auto PR Description by Labels

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update PR description based on labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // 1️⃣ Lista de tipos
            const types = ["feature", "fix", "improvement", "refactor", "chore"];
            const checkboxes = {
              feature: "🚀 Feature",
              fix: "🐛 Fix",
              improvement: "✨ Improvement",
              refactor: "🔧 Refactor",
              chore: "🧹 Chore"
            };

            // 2️⃣ Inicializa como falso
            const typeStatus = {};
            types.forEach(t => typeStatus[t] = false);

            // 3️⃣ Ativa os tipos conforme labels da PR
            pr.labels.forEach(label => {
              const name = label.name.toLowerCase();
              if (types.includes(name)) typeStatus[name] = true;
            });

            // 4️⃣ Separa descrição do usuário
            let userContent = "";
            if (pr.body) {
              const split = pr.body.split("## 📦 Tipo da mudança");
              userContent = split[0].trim();
            } else {
              userContent = "## 📝 O que foi feito?\n\nDescreva resumidamente o que esta PR implementa.";
            }

            // 5️⃣ Cria seção de Tipo da mudança
            let typeSection = "## 📦 Tipo da mudança\n\n";
            types.forEach(t => {
              typeSection += `- [${typeStatus[t] ? "x" : " "}] ${checkboxes[t]}\n`;
            });

            // 6️⃣ Mantém seção de screenshots
            let screenshots = "";
            if (pr.body && pr.body.includes("## 📸 Screenshots")) {
              const parts = pr.body.split("## 📸 Screenshots");
              screenshots = "## 📸 Screenshots" + parts[1];
            } else {
              screenshots = "\n## 📸 Screenshots (se necessário)\nAnexe imagens aqui.\n";
            }

            // 7️⃣ Monta descrição final
            const description = `
${userContent}

${typeSection}

${screenshots}
`.trim();

            // 8️⃣ Atualiza PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });

            console.log("Descrição da PR atualizada automaticamente com base nos labels.");
