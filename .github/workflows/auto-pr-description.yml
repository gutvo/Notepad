name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  set_description:
    runs-on: ubuntu-latest
    steps:
      - name: Set automatic PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Não sobrescrever se o autor já escreveu algo
            if (pr.body && pr.body.trim().length > 10) {
              console.log("Descrição já existe — ignorando.");
              return;
            }

            const branch = pr.head.ref.toLowerCase();
            const type = {
              feature: branch.startsWith("feature/"),
              fix: branch.startsWith("fix/"),
              improvement: branch.startsWith("improvement/"),
              refactor: branch.startsWith("refactor/"),
              chore: branch.startsWith("chore/")
            };

            const description = `## 📝 O que foi feito?

Descreva resumidamente o que esta PR implementa.

## 📦 Tipo da mudança

- [${type.feature ? "x" : " "}] 🚀 Feature
- [${type.fix ? "x" : " "}] 🐛 Fix
- [${type.improvement ? "x" : " "}] ✨ Improvement
- [${type.refactor ? "x" : " "}] 🔧 Refactor
- [${type.chore ? "x" : " "}] 🧹 Chore

## 📸 Screenshots (se necessário)

Anexe imagens aqui.
`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });

            console.log("Descrição preenchida automaticamente.");
