name: Auto PR Label

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add_label:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            let label = "";

            if (branch.startsWith("feature/")) label = "feature";
            if (branch.startsWith("fix/")) label = "fix";
            if (branch.startsWith("refactor/")) label = "refactor";
            if (branch.startsWith("improvement/")) label = "improvement";

            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label],
              });
            }
