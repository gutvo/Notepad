name: Auto PR Label

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Label based on branch or commits
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref.toLowerCase();

            const labels = new Set();

            // Branch rules
            if (branch.startsWith("feature/")) labels.add("feature");
            if (branch.startsWith("fix/")) labels.add("fix");
            if (branch.startsWith("refactor/")) labels.add("refactor");
            if (branch.startsWith("improvement/")) labels.add("improvement");

            // Buscar commits do PR
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const commitTypes = [
              "feat",
              "fix",
              "chore",
              "docs",
              "style",
              "refactor",
              "test",
              "perf",
              "ci"
            ];

            for (const commit of commits.data) {
              const message = commit.commit.message.toLowerCase();

              for (const type of commitTypes) {
                if (message.startsWith(type + ":") || message.startsWith(type + "(")) {
                  labels.add(type);
                }
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels)
              });

              console.log("Labels adicionadas:", Array.from(labels));
            }