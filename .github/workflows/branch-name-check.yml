name: Branch Name Validator

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  validate_branch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|refactor|improvement)\/[a-z0-9-]+$ ]]; then
            echo "❌ Nome da branch inválido: $BRANCH_NAME"
            echo "Use: feature/nome-da-tarefa"
            exit 1
          fi
        shell: bash
